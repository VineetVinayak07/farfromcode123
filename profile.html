<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile · Spot-fix</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- PHONE STATUS BAR -->
    <div class="status-bar">

        <span class="status-time" id="statusTime">9:41</span>

        <div class="status-icons">

            <svg viewBox="0 0 20 14" width="19" height="13" fill="currentColor"><rect x="0" y="9" width="3" height="5" rx="0.5"/><rect x="5.5" y="6" width="3" height="8" rx="0.5"/><rect x="11" y="3" width="3" height="11" rx="0.5"/><rect x="16.5" y="0" width="3" height="14" rx="0.5"/></svg>

            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a10 10 0 0 1 16 0"/><path d="M7 12.5a6 6 0 0 1 10 0"/><path d="M10.5 16a2 2 0 0 1 3 0"/></svg>

            <div class="status-battery">
                <span>82%</span>
                <svg viewBox="0 0 26 14" width="24" height="13" fill="none"><rect x="0.75" y="0.75" width="21" height="12.5" rx="3" stroke="currentColor" stroke-width="1.4"/><rect x="2.5" y="2.5" width="15" height="9" rx="1.6" fill="currentColor"/><rect x="23" y="4.5" width="2.2" height="5" rx="1" fill="currentColor"/></svg>
            </div>

        </div>

    </div>

    <!-- HEADER -->
    <header class="header">

        <div class="header-left">

            <button class="icon-button back-button" onclick="location.href='index.html'" aria-label="Back to home">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </button>

            <span class="page-title">Profile</span>

        </div>

        <button class="icon-button" onclick="profileAction('Settings')" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

    </header>


    <!-- PROFILE CARD -->
    <div class="profile-card">

        <div class="avatar-wrap">

            <div class="avatar" id="avatarPreview">
                <span id="avatarInitials">C</span>
            </div>

            <button class="avatar-edit" onclick="document.getElementById('avatarInput').click()" aria-label="Change photo">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>

            <input type="file" id="avatarInput" accept="image/*" hidden onchange="handleAvatarChange(event)">

        </div>

        <div class="profile-name">Citizen User</div>
        <div class="profile-email">citizen@spotfix.app</div>

        <button class="profile-edit-button" onclick="profileAction('Edit Profile')">
            Edit Profile
        </button>

    </div>


    <!-- STATS -->
    <div class="profile-stats">

        <div class="stat-card">
            <div class="stat-number" id="reportsCount">0</div>
            <div class="stat-label">Submitted</div>
        </div>

        <div class="stat-card">
            <div class="stat-number">4</div>
            <div class="stat-label">Resolved</div>
        </div>

        <div class="stat-card">
            <div class="stat-number">120</div>
            <div class="stat-label">Points</div>
        </div>

    </div>


    <!-- ACCOUNT OPTIONS -->
    <div class="profile-group">

        <div class="profile-group-label">Account</div>

        <button class="profile-option" onclick="location.href='reports.html'">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">My Reports</div>
                <div class="profile-option-sub">View all issues you've submitted</div>
            </div>
            <svg class="profile-option-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="profile-option" onclick="profileAction('Notifications')">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">Notifications</div>
                <div class="profile-option-sub">Manage alerts and updates</div>
            </div>
            <svg class="profile-option-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="profile-option" onclick="profileAction('Privacy & Permissions')">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">Privacy &amp; Permissions</div>
                <div class="profile-option-sub">Location access, data usage</div>
            </div>
            <svg class="profile-option-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

    </div>


    <!-- SUPPORT OPTIONS -->
    <div class="profile-group">

        <div class="profile-group-label">Support</div>

        <button class="profile-option" onclick="profileAction('Help & Support')">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.5"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">Help &amp; Support</div>
                <div class="profile-option-sub">FAQs and contact us</div>
            </div>
            <svg class="profile-option-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="profile-option" onclick="profileAction('About Spot-fix')">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">About Spot-fix</div>
                <div class="profile-option-sub">Version 1.0.0</div>
            </div>
            <svg class="profile-option-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

        <button class="profile-option danger" onclick="signOut()">
            <div class="profile-option-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
            <div class="profile-option-text">
                <div class="profile-option-title">Sign Out</div>
            </div>
        </button>

    </div>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="nav-item" onclick="location.href='index.html'">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
            </span>
            <span>Home</span>
        </button>

        <button class="nav-item" onclick="location.href='index.html#map'">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <span>Map</span>
        </button>

        <button class="nav-item" onclick="location.href='reports.html'">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9z"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></svg>
            </span>
            <span>My Reports</span>
        </button>

        <button class="nav-item active" onclick="location.href='profile.html'">
            <span class="nav-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            <span>Profile</span>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
