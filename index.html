<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotFix — Spot it. Fix it.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <main class="auth-app">

        <header class="brand">
            <img src="spotfix-logo.png" alt="SpotFix logo" class="brand-logo">
            <div>
                <div class="brand-name">SpotFix</div>
                <div class="brand-tagline">Spot it. Fix it.</div>
            </div>
        </header>

        <section class="welcome-section">
            <p class="small-label">CIVIC REPORTING</p>
            <h1>Welcome to<br><span>SpotFix</span></h1>
            <p class="welcome-copy">
                Spot a civic issue, put it on the map, and help your community fix it.
            </p>

            <div class="welcome-features">
                <div>📍 Location based</div>
                <div>🗺️ Shared map</div>
                <div>🤝 Community driven</div>
            </div>

            <div class="auth-buttons">
                <a href="login.html" class="primary-btn">Log in</a>
                <a href="signup.html" class="secondary-btn">Create an account</a>
            </div>
        </section>

        <p class="welcome-footer">YOUR VOICE • YOUR CITY • YOUR IMPACT</p>
    </main>
</body>
</html>
